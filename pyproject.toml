[project]
name = "abiotic-ch4"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["F", "I", "B", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# SIM300 misfires on `assert x == approx(y)`, which is the correct pytest form.
"tests/*" = ["SIM300"]
